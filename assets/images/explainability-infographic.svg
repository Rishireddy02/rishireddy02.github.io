<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1797" width="1400" height="1797" font-family="'Georgia', 'Cambria', serif"><rect x="0" y="0" width="1400" height="1797" fill="#fafaf6"/><text x="700.0" y="78" font-size="42" fill="#1a1a1a" font-weight="600" text-anchor="middle" font-family="'Georgia', 'Cambria', serif" letter-spacing="0.5">Explainable AI: Opening the Black Box</text><text x="700.0" y="112" font-size="19" fill="#5a5a5a" font-style="italic" text-anchor="middle" font-family="'Georgia', 'Cambria', serif">Why Transparency Matters, What Makes It Hard, and How Industry Leaders Are Responding</text><line x1="400" y1="138" x2="1000" y2="138" stroke="#7a1f2b" stroke-width="2"/><g transform="translate(60,175)"><rect x="0" y="0" width="1280" height="46" fill="#7a1f2b"/><text x="20" y="30" font-size="22" fill="#fafaf6" font-weight="600" font-family="'Georgia', 'Cambria', serif" letter-spacing="2">I.  WHAT IT IS &amp; WHY IT MATTERS</text><text x="1260" y="30" font-size="13" fill="#e8cdd2" font-style="italic" text-anchor="end" font-family="'Georgia', 'Cambria', serif">Transparency as the foundation of trust</text></g><rect x="60" y="243" width="1280" height="96" fill="#ffffff" stroke="#d4d4cf" stroke-width="1"/><rect x="60" y="243" width="8" height="96" fill="#7a1f2b"/><text x="88" y="277" font-size="13" fill="#7a1f2b" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif" letter-spacing="2">DEFINITION</text><text x="88" y="301" font-size="14.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">Explainable AI (XAI) is the set of methods that make a model's outputs and decisions transparent and</text><text x="88" y="321" font-size="14.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">understandable to humans — answering not just what a model predicted, but why. It is critical wherever AI</text><text x="88" y="341" font-size="14.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">informs high-stakes decisions in healthcare, finance, and law.</text><rect x="60" y="361" width="305" height="150" fill="#ffffff" stroke="#d4d4cf" stroke-width="1"/><rect x="60" y="361" width="305" height="6" fill="#7a1f2b"/><text x="80" y="401" font-size="12.5" fill="#7a1f2b" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif" letter-spacing="2">WHY 01</text><text x="80" y="427" font-size="18" fill="#1a1a1a" font-weight="700" font-family="'Georgia', 'Cambria', serif">Trust &amp; Adoption</text><text x="80" y="453" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">Users and stakeholders accept AI</text><text x="80" y="470" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">only when they can understand why</text><text x="80" y="487" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">a decision was reached.</text><rect x="385" y="361" width="305" height="150" fill="#ffffff" stroke="#d4d4cf" stroke-width="1"/><rect x="385" y="361" width="305" height="6" fill="#7a1f2b"/><text x="405" y="401" font-size="12.5" fill="#7a1f2b" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif" letter-spacing="2">WHY 02</text><text x="405" y="427" font-size="18" fill="#1a1a1a" font-weight="700" font-family="'Georgia', 'Cambria', serif">Accountability &amp; Law</text><text x="405" y="453" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">Regulations such as the EU AI Act</text><text x="405" y="470" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">and GDPR's “right to explanation”</text><text x="405" y="487" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">demand justifiable decisions.</text><rect x="710" y="361" width="305" height="150" fill="#ffffff" stroke="#d4d4cf" stroke-width="1"/><rect x="710" y="361" width="305" height="6" fill="#7a1f2b"/><text x="730" y="401" font-size="12.5" fill="#7a1f2b" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif" letter-spacing="2">WHY 03</text><text x="730" y="427" font-size="18" fill="#1a1a1a" font-weight="700" font-family="'Georgia', 'Cambria', serif">Bias Detection</text><text x="730" y="453" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">Transparency exposes unfair or</text><text x="730" y="470" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">discriminatory patterns before they</text><text x="730" y="487" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">reach real users and cause harm.</text><rect x="1035" y="361" width="305" height="150" fill="#ffffff" stroke="#d4d4cf" stroke-width="1"/><rect x="1035" y="361" width="305" height="6" fill="#7a1f2b"/><text x="1055" y="401" font-size="12.5" fill="#7a1f2b" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif" letter-spacing="2">WHY 04</text><text x="1055" y="427" font-size="18" fill="#1a1a1a" font-weight="700" font-family="'Georgia', 'Cambria', serif">Safety &amp; Debugging</text><text x="1055" y="453" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">Seeing the reasoning helps engineers</text><text x="1055" y="470" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">catch errors, hallucinations, and</text><text x="1055" y="487" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">failure modes early.</text><g transform="translate(60,545)"><rect x="0" y="0" width="1280" height="46" fill="#2c3e5d"/><text x="20" y="30" font-size="22" fill="#fafaf6" font-weight="600" font-family="'Georgia', 'Cambria', serif" letter-spacing="2">II.  CHALLENGES IN EXPLAINABILITY</text><text x="1260" y="30" font-size="13" fill="#cfd4dc" font-style="italic" text-anchor="end" font-family="'Georgia', 'Cambria', serif">Why opening the box is hard</text></g><rect x="60" y="611" width="1280" height="62" fill="#ffffff" stroke="#d4d4cf" stroke-width="1"/><circle cx="98" cy="642" r="20" fill="#fafaf6" stroke="#2c3e5d" stroke-width="2"/><text x="98" y="649" font-size="20" fill="#2c3e5d" font-weight="700" text-anchor="middle" font-family="'Georgia', 'Cambria', serif">1</text><text x="138" y="638" font-size="18" fill="#1a1a1a" font-weight="700" font-family="'Georgia', 'Cambria', serif">Opacity &amp; Complexity</text><text x="138" y="660" font-size="13" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">Outputs emerge from billions of parameters in non-linear interactions; no single component explains a result.</text><text x="1322" y="648" font-size="11.5" fill="#2c3e5d" font-weight="600" text-anchor="end" font-family="'Helvetica Neue', Helvetica, sans-serif" letter-spacing="1">BLACK BOX</text><rect x="60" y="681" width="1280" height="62" fill="#ffffff" stroke="#d4d4cf" stroke-width="1"/><circle cx="98" cy="712" r="20" fill="#fafaf6" stroke="#2c3e5d" stroke-width="2"/><text x="98" y="719" font-size="20" fill="#2c3e5d" font-weight="700" text-anchor="middle" font-family="'Georgia', 'Cambria', serif">2</text><text x="138" y="708" font-size="18" fill="#1a1a1a" font-weight="700" font-family="'Georgia', 'Cambria', serif">Post-Hoc Faithfulness</text><text x="138" y="730" font-size="13" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">Explanations produced after a decision may not reflect the model's true internal reasoning.</text><text x="1322" y="718" font-size="11.5" fill="#2c3e5d" font-weight="600" text-anchor="end" font-family="'Helvetica Neue', Helvetica, sans-serif" letter-spacing="1">TRUST GAP</text><rect x="60" y="751" width="1280" height="62" fill="#ffffff" stroke="#d4d4cf" stroke-width="1"/><circle cx="98" cy="782" r="20" fill="#fafaf6" stroke="#2c3e5d" stroke-width="2"/><text x="98" y="789" font-size="20" fill="#2c3e5d" font-weight="700" text-anchor="middle" font-family="'Georgia', 'Cambria', serif">3</text><text x="138" y="778" font-size="18" fill="#1a1a1a" font-weight="700" font-family="'Georgia', 'Cambria', serif">Distributed Representations</text><text x="138" y="800" font-size="13" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">Concepts are spread and superposed across the network, so features overlap and resist clean reading.</text><text x="1322" y="788" font-size="11.5" fill="#2c3e5d" font-weight="600" text-anchor="end" font-family="'Helvetica Neue', Helvetica, sans-serif" letter-spacing="1">SCALE</text><rect x="60" y="821" width="1280" height="62" fill="#ffffff" stroke="#d4d4cf" stroke-width="1"/><circle cx="98" cy="852" r="20" fill="#fafaf6" stroke="#2c3e5d" stroke-width="2"/><text x="98" y="859" font-size="20" fill="#2c3e5d" font-weight="700" text-anchor="middle" font-family="'Georgia', 'Cambria', serif">4</text><text x="138" y="848" font-size="18" fill="#1a1a1a" font-weight="700" font-family="'Georgia', 'Cambria', serif">Data Quality &amp; Bias</text><text x="138" y="870" font-size="13" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">Models inherit noise and social bias from massive training data, which surface in opaque ways.</text><text x="1322" y="858" font-size="11.5" fill="#2c3e5d" font-weight="600" text-anchor="end" font-family="'Helvetica Neue', Helvetica, sans-serif" letter-spacing="1">BIAS</text><rect x="60" y="891" width="1280" height="62" fill="#ffffff" stroke="#d4d4cf" stroke-width="1"/><circle cx="98" cy="922" r="20" fill="#fafaf6" stroke="#2c3e5d" stroke-width="2"/><text x="98" y="929" font-size="20" fill="#2c3e5d" font-weight="700" text-anchor="middle" font-family="'Georgia', 'Cambria', serif">5</text><text x="138" y="918" font-size="18" fill="#1a1a1a" font-weight="700" font-family="'Georgia', 'Cambria', serif">Regulation &amp; Standards</text><text x="138" y="940" font-size="13" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">There is still no agreed standard for what counts as an adequate or sufficient explanation.</text><text x="1322" y="928" font-size="11.5" fill="#2c3e5d" font-weight="600" text-anchor="end" font-family="'Helvetica Neue', Helvetica, sans-serif" letter-spacing="1">GOVERNANCE</text><g transform="translate(60,987)"><rect x="0" y="0" width="1280" height="46" fill="#7a1f2b"/><text x="20" y="30" font-size="22" fill="#fafaf6" font-weight="600" font-family="'Georgia', 'Cambria', serif" letter-spacing="2">III.  VALIDATION &amp; PERFORMANCE METRICS</text><text x="1260" y="30" font-size="13" fill="#e8cdd2" font-style="italic" text-anchor="end" font-family="'Georgia', 'Cambria', serif">Measuring reliability earns trust</text></g><rect x="60" y="1053" width="620" height="196" fill="#ffffff" stroke="#d4d4cf" stroke-width="1"/><rect x="60" y="1053" width="620" height="6" fill="#7a1f2b"/><text x="82" y="1093" font-size="16" fill="#1a1a1a" font-weight="700" font-family="'Georgia', 'Cambria', serif">Validation Techniques</text><circle cx="88" cy="1117" r="3" fill="#7a1f2b"/><text x="102" y="1121" font-size="13" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">Held-out test sets — score on data never seen in training</text><circle cx="88" cy="1142" r="3" fill="#7a1f2b"/><text x="102" y="1146" font-size="13" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">K-fold cross-validation — confirm results are stable</text><circle cx="88" cy="1167" r="3" fill="#7a1f2b"/><text x="102" y="1171" font-size="13" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">Adversarial red-teaming — stress-test for unsafe outputs</text><circle cx="88" cy="1192" r="3" fill="#7a1f2b"/><text x="102" y="1196" font-size="13" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">Benchmarking — MMLU, HELM, and task-specific suites</text><circle cx="88" cy="1217" r="3" fill="#7a1f2b"/><text x="102" y="1221" font-size="13" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">Continuous monitoring — detect drift after deployment</text><rect x="720" y="1053" width="620" height="196" fill="#ffffff" stroke="#d4d4cf" stroke-width="1"/><rect x="720" y="1053" width="620" height="6" fill="#2c3e5d"/><text x="742" y="1093" font-size="16" fill="#1a1a1a" font-weight="700" font-family="'Georgia', 'Cambria', serif">Performance Metrics</text><circle cx="748" cy="1117" r="3" fill="#2c3e5d"/><text x="762" y="1121" font-size="13" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">Accuracy — overall share of correct predictions</text><circle cx="748" cy="1142" r="3" fill="#2c3e5d"/><text x="762" y="1146" font-size="13" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">Precision &amp; Recall — false-alarm vs. miss trade-off</text><circle cx="748" cy="1167" r="3" fill="#2c3e5d"/><text x="762" y="1171" font-size="13" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">F1 score — balanced measure for imbalanced data</text><circle cx="748" cy="1192" r="3" fill="#2c3e5d"/><text x="762" y="1196" font-size="13" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">ROC-AUC — class separation across thresholds</text><circle cx="748" cy="1217" r="3" fill="#2c3e5d"/><text x="762" y="1221" font-size="13" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">Calibration — do confidence scores match reality?</text><rect x="60" y="1263" width="1280" height="44" fill="#f1e3e5" stroke="#7a1f2b" stroke-width="1"/><text x="700.0" y="1291" font-size="14" fill="#7a1f2b" font-weight="600" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, sans-serif">Rigorous validation + transparent metrics = measurable, accountable reliability that stakeholders can verify.</text><g transform="translate(60,1335)"><rect x="0" y="0" width="1280" height="46" fill="#2c3e5d"/><text x="20" y="30" font-size="22" fill="#fafaf6" font-weight="600" font-family="'Georgia', 'Cambria', serif" letter-spacing="2">IV.  CURRENT SOLUTIONS FROM INDUSTRY LEADERS</text><text x="1260" y="30" font-size="13" fill="#cfd4dc" font-style="italic" text-anchor="end" font-family="'Georgia', 'Cambria', serif">Techniques in practice today</text></g><rect x="60" y="1401" width="305" height="184" fill="#ffffff" stroke="#d4d4cf" stroke-width="1"/><rect x="60" y="1401" width="305" height="34" fill="#2c3e5d"/><text x="76" y="1424" font-size="15" fill="#fafaf6" font-weight="600" font-family="'Georgia', 'Cambria', serif" letter-spacing="0.5">OpenAI</text><text x="76" y="1463" font-size="14.5" fill="#1a1a1a" font-weight="700" font-family="'Georgia', 'Cambria', serif">Automated Interpretability</text><text x="76" y="1487" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">Used GPT-4 to write and score</text><text x="76" y="1504" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">explanations for every neuron in</text><text x="76" y="1521" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">GPT-2; publishes system cards</text><text x="76" y="1538" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">documenting limits and risks.</text><rect x="385" y="1401" width="305" height="184" fill="#ffffff" stroke="#d4d4cf" stroke-width="1"/><rect x="385" y="1401" width="305" height="34" fill="#2c3e5d"/><text x="401" y="1424" font-size="15" fill="#fafaf6" font-weight="600" font-family="'Georgia', 'Cambria', serif" letter-spacing="0.5">Anthropic</text><text x="401" y="1463" font-size="14.5" fill="#1a1a1a" font-weight="700" font-family="'Georgia', 'Cambria', serif">Mechanistic Interpretability</text><text x="401" y="1487" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">Sparse autoencoders mapped</text><text x="401" y="1504" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">millions of human-interpretable</text><text x="401" y="1521" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">“features” inside Claude 3 Sonnet,</text><text x="401" y="1538" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">which can be tuned up or down.</text><rect x="710" y="1401" width="305" height="184" fill="#ffffff" stroke="#d4d4cf" stroke-width="1"/><rect x="710" y="1401" width="305" height="34" fill="#2c3e5d"/><text x="726" y="1424" font-size="15" fill="#fafaf6" font-weight="600" font-family="'Georgia', 'Cambria', serif" letter-spacing="0.5">Google / DeepMind</text><text x="726" y="1463" font-size="14.5" fill="#1a1a1a" font-weight="700" font-family="'Georgia', 'Cambria', serif">Model Cards</text><text x="726" y="1487" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">Standardized transparency reports</text><text x="726" y="1504" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">stating a model's intended use,</text><text x="726" y="1521" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">measured performance, and</text><text x="726" y="1538" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">known limitations.</text><rect x="1035" y="1401" width="305" height="184" fill="#ffffff" stroke="#d4d4cf" stroke-width="1"/><rect x="1035" y="1401" width="305" height="34" fill="#2c3e5d"/><text x="1051" y="1424" font-size="15" fill="#fafaf6" font-weight="600" font-family="'Georgia', 'Cambria', serif" letter-spacing="0.5">Meta</text><text x="1051" y="1463" font-size="14.5" fill="#1a1a1a" font-weight="700" font-family="'Georgia', 'Cambria', serif">Open-Weight Release</text><text x="1051" y="1487" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">Open LLaMA models let external</text><text x="1051" y="1504" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">researchers inspect, probe, and</text><text x="1051" y="1521" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">audit the network directly,</text><text x="1051" y="1538" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">widening scrutiny.</text><rect x="60" y="1599" width="1280" height="44" fill="#e6ebf2" stroke="#2c3e5d" stroke-width="1"/><text x="700.0" y="1627" font-size="13.5" fill="#2c3e5d" font-weight="600" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, sans-serif">Shared techniques:  chain-of-thought prompting  ·  attention visualization  ·  feature attribution (SHAP / LIME)  ·  model &amp; system cards</text><rect x="60" y="1671" width="1280" height="84" fill="#7a1f2b"/><text x="86" y="1703" font-size="14" fill="#e8cdd2" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif" letter-spacing="2">KEY TAKEAWAY</text><text x="86" y="1727" font-size="15" fill="#fafaf6" font-family="'Georgia', 'Cambria', serif">Explainability is not a single feature but a layered practice — combining interpretability research, rigorous</text><text x="86" y="1749" font-size="15" fill="#fafaf6" font-family="'Georgia', 'Cambria', serif">validation, and honest reporting — that turns opaque models into systems people can actually trust.</text><text x="60" y="1779" font-size="11.5" fill="#5a5a5a" font-style="italic" font-family="'Helvetica Neue', Helvetica, sans-serif">Sources: Anthropic (2024); OpenAI (2023); Barredo Arrieta et al. (2020); Mitchell et al. (2019); Wei et al. (2022).</text><text x="1340" y="1779" font-size="11.5" fill="#5a5a5a" text-anchor="end" font-family="'Helvetica Neue', Helvetica, sans-serif">Artifact by Rishitha Reddy  ·  AIML-501: Model Development</text></svg>