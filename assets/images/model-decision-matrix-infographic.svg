<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1333" width="1400" height="1333" font-family="'Georgia', 'Cambria', serif"><rect x="0" y="0" width="1400" height="1333" fill="#fafaf6"/><text x="700.0" y="78" font-size="40" fill="#1a1a1a" font-weight="600" text-anchor="middle" font-family="'Georgia', 'Cambria', serif" letter-spacing="0.5">Pre-Trained Model Decision Matrix</text><text x="700.0" y="112" font-size="19" fill="#5a5a5a" font-style="italic" text-anchor="middle" font-family="'Georgia', 'Cambria', serif">Trading Off Size, Accuracy, Speed &amp; Interpretability Across NLP, Vision &amp; Tabular Domains</text><line x1="420" y1="138" x2="980" y2="138" stroke="#7a1f2b" stroke-width="2"/><g transform="translate(60,175)"><rect x="0" y="0" width="1280" height="46" fill="#7a1f2b"/><text x="20" y="30" font-size="22" fill="#fafaf6" font-weight="600" font-family="'Georgia', 'Cambria', serif" letter-spacing="2">I.  WHY THE TRADE-OFFS MATTER</text><text x="1260" y="30" font-size="13" fill="#e8cdd2" font-style="italic" text-anchor="end" font-family="'Georgia', 'Cambria', serif">No model wins on every axis</text></g><rect x="60" y="243" width="1280" height="92" fill="#ffffff" stroke="#d4d4cf" stroke-width="1"/><rect x="60" y="243" width="8" height="92" fill="#7a1f2b"/><text x="88" y="277" font-size="14" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">Selecting a pre-trained model is rarely about raw accuracy alone. Every choice balances model size (memory and cost),</text><text x="88" y="297" font-size="14" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">accuracy (benchmark performance), inference speed (latency), and interpretability — how easily a human can understand</text><text x="88" y="317" font-size="14" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">why the model decided as it did. The right model depends on the domain and the deployment constraints, not a single score.</text><g transform="translate(60,361)"><rect x="0" y="0" width="1280" height="46" fill="#2c3e5d"/><text x="20" y="30" font-size="22" fill="#fafaf6" font-weight="600" font-family="'Georgia', 'Cambria', serif" letter-spacing="2">II.  THE DECISION MATRIX</text><text x="1260" y="30" font-size="13" fill="#cfd4dc" font-style="italic" text-anchor="end" font-family="'Georgia', 'Cambria', serif">Six models · three domains</text></g><rect x="60" y="425" width="1280" height="40" fill="#2c3e5d"/><text x="72" y="450" font-size="13.5" fill="#fafaf6" font-weight="700" font-family="'Helvetica Neue', Helvetica, sans-serif" letter-spacing="0.5">Domain</text><text x="222" y="450" font-size="13.5" fill="#fafaf6" font-weight="700" font-family="'Helvetica Neue', Helvetica, sans-serif" letter-spacing="0.5">Model</text><text x="394" y="450" font-size="13.5" fill="#fafaf6" font-weight="700" font-family="'Helvetica Neue', Helvetica, sans-serif" letter-spacing="0.5">Size</text><text x="562" y="450" font-size="13.5" fill="#fafaf6" font-weight="700" font-family="'Helvetica Neue', Helvetica, sans-serif" letter-spacing="0.5">Accuracy</text><text x="752" y="450" font-size="13.5" fill="#fafaf6" font-weight="700" font-family="'Helvetica Neue', Helvetica, sans-serif" letter-spacing="0.5">Speed</text><text x="910" y="450" font-size="13.5" fill="#fafaf6" font-weight="700" font-family="'Helvetica Neue', Helvetica, sans-serif" letter-spacing="0.5">Interpretability</text><text x="1092" y="450" font-size="13.5" fill="#fafaf6" font-weight="700" font-family="'Helvetica Neue', Helvetica, sans-serif" letter-spacing="0.5">Best Use Case</text><rect x="60" y="465" width="1280" height="70" fill="#ffffff" stroke="#d4d4cf" stroke-width="1"/><text x="72" y="505" font-size="13" fill="#2c3e5d" font-weight="700" font-family="'Georgia', 'Cambria', serif">NLP / GenAI</text><text x="222" y="505" font-size="14.5" fill="#1a1a1a" font-weight="700" font-family="'Georgia', 'Cambria', serif">GPT-4*</text><circle cx="399" cy="492" r="5.5" fill="#b5483d"/><text x="412" y="497" font-size="13.5" fill="#1a1a1a" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif">~1T+</text><text x="395" y="517" font-size="11.5" fill="#5a5a5a" font-family="'Helvetica Neue', Helvetica, sans-serif">Heavy</text><circle cx="567" cy="492" r="5.5" fill="#2a8f63"/><text x="580" y="497" font-size="13.5" fill="#1a1a1a" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif">MMLU ~86%</text><text x="563" y="517" font-size="11.5" fill="#5a5a5a" font-family="'Helvetica Neue', Helvetica, sans-serif">SOTA</text><circle cx="757" cy="492" r="5.5" fill="#b5483d"/><text x="770" y="497" font-size="13.5" fill="#1a1a1a" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif">High latency</text><text x="753" y="517" font-size="11.5" fill="#5a5a5a" font-family="'Helvetica Neue', Helvetica, sans-serif">Slow</text><circle cx="915" cy="492" r="5.5" fill="#b5483d"/><text x="928" y="497" font-size="13.5" fill="#1a1a1a" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif">Very low</text><text x="1092" y="493" font-size="12" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">Open-ended generation,</text><text x="1092" y="509" font-size="12" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">reasoning, chat, summarization</text><rect x="60" y="535" width="1280" height="70" fill="#f5f3ee" stroke="#d4d4cf" stroke-width="1"/><text x="72" y="575" font-size="13" fill="#2c3e5d" font-weight="700" font-family="'Georgia', 'Cambria', serif">NLP</text><text x="222" y="575" font-size="14.5" fill="#1a1a1a" font-weight="700" font-family="'Georgia', 'Cambria', serif">BERT-base</text><circle cx="399" cy="562" r="5.5" fill="#c8860a"/><text x="412" y="567" font-size="13.5" fill="#1a1a1a" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif">110M</text><text x="395" y="587" font-size="11.5" fill="#5a5a5a" font-family="'Helvetica Neue', Helvetica, sans-serif">Moderate</text><circle cx="567" cy="562" r="5.5" fill="#2a8f63"/><text x="580" y="567" font-size="13.5" fill="#1a1a1a" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif">GLUE ~79</text><text x="563" y="587" font-size="11.5" fill="#5a5a5a" font-family="'Helvetica Neue', Helvetica, sans-serif">High</text><circle cx="757" cy="562" r="5.5" fill="#2a8f63"/><text x="770" y="567" font-size="13.5" fill="#1a1a1a" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif">Fast</text><text x="753" y="587" font-size="11.5" fill="#5a5a5a" font-family="'Helvetica Neue', Helvetica, sans-serif">Fast</text><circle cx="915" cy="562" r="5.5" fill="#c8860a"/><text x="928" y="567" font-size="13.5" fill="#1a1a1a" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif">Low</text><text x="1092" y="563" font-size="12" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">Classification, NER, semantic</text><text x="1092" y="579" font-size="12" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">search, embeddings</text><rect x="60" y="605" width="1280" height="70" fill="#ffffff" stroke="#d4d4cf" stroke-width="1"/><text x="72" y="645" font-size="13" fill="#2c3e5d" font-weight="700" font-family="'Georgia', 'Cambria', serif">Vision</text><text x="222" y="645" font-size="14.5" fill="#1a1a1a" font-weight="700" font-family="'Georgia', 'Cambria', serif">EfficientNet-B7</text><circle cx="399" cy="632" r="5.5" fill="#c8860a"/><text x="412" y="637" font-size="13.5" fill="#1a1a1a" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif">66M</text><text x="395" y="657" font-size="11.5" fill="#5a5a5a" font-family="'Helvetica Neue', Helvetica, sans-serif">Moderate</text><circle cx="567" cy="632" r="5.5" fill="#2a8f63"/><text x="580" y="637" font-size="13.5" fill="#1a1a1a" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif">84.3% top-1</text><text x="563" y="657" font-size="11.5" fill="#5a5a5a" font-family="'Helvetica Neue', Helvetica, sans-serif">V. high</text><circle cx="757" cy="632" r="5.5" fill="#c8860a"/><text x="770" y="637" font-size="13.5" fill="#1a1a1a" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif">Moderate</text><text x="753" y="657" font-size="11.5" fill="#5a5a5a" font-family="'Helvetica Neue', Helvetica, sans-serif">37B FLOPs</text><circle cx="915" cy="632" r="5.5" fill="#c8860a"/><text x="928" y="637" font-size="13.5" fill="#1a1a1a" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif">Low</text><text x="1092" y="633" font-size="12" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">High-accuracy image</text><text x="1092" y="649" font-size="12" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">classification on servers</text><rect x="60" y="675" width="1280" height="70" fill="#f5f3ee" stroke="#d4d4cf" stroke-width="1"/><text x="72" y="715" font-size="13" fill="#2c3e5d" font-weight="700" font-family="'Georgia', 'Cambria', serif">Vision</text><text x="222" y="715" font-size="14.5" fill="#1a1a1a" font-weight="700" font-family="'Georgia', 'Cambria', serif">MobileNetV2</text><circle cx="399" cy="702" r="5.5" fill="#2a8f63"/><text x="412" y="707" font-size="13.5" fill="#1a1a1a" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif">3.4M</text><text x="395" y="727" font-size="11.5" fill="#5a5a5a" font-family="'Helvetica Neue', Helvetica, sans-serif">Light</text><circle cx="567" cy="702" r="5.5" fill="#c8860a"/><text x="580" y="707" font-size="13.5" fill="#1a1a1a" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif">72% top-1</text><text x="563" y="727" font-size="11.5" fill="#5a5a5a" font-family="'Helvetica Neue', Helvetica, sans-serif">Good</text><circle cx="757" cy="702" r="5.5" fill="#2a8f63"/><text x="770" y="707" font-size="13.5" fill="#1a1a1a" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif">Very fast</text><text x="753" y="727" font-size="11.5" fill="#5a5a5a" font-family="'Helvetica Neue', Helvetica, sans-serif">~300M FLOPs</text><circle cx="915" cy="702" r="5.5" fill="#c8860a"/><text x="928" y="707" font-size="13.5" fill="#1a1a1a" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif">Low</text><text x="1092" y="703" font-size="12" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">On-device / edge &amp; real-time</text><text x="1092" y="719" font-size="12" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">mobile vision</text><rect x="60" y="745" width="1280" height="70" fill="#ffffff" stroke="#d4d4cf" stroke-width="1"/><text x="72" y="785" font-size="13" fill="#2c3e5d" font-weight="700" font-family="'Georgia', 'Cambria', serif">Tabular</text><text x="222" y="785" font-size="14.5" fill="#1a1a1a" font-weight="700" font-family="'Georgia', 'Cambria', serif">XGBoost</text><circle cx="399" cy="772" r="5.5" fill="#2a8f63"/><text x="412" y="777" font-size="13.5" fill="#1a1a1a" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif">&lt; 50 MB</text><text x="395" y="797" font-size="11.5" fill="#5a5a5a" font-family="'Helvetica Neue', Helvetica, sans-serif">Light</text><circle cx="567" cy="772" r="5.5" fill="#2a8f63"/><text x="580" y="777" font-size="13.5" fill="#1a1a1a" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif">Top on tabular</text><text x="563" y="797" font-size="11.5" fill="#5a5a5a" font-family="'Helvetica Neue', Helvetica, sans-serif">V. high</text><circle cx="757" cy="772" r="5.5" fill="#2a8f63"/><text x="770" y="777" font-size="13.5" fill="#1a1a1a" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif">Very fast</text><text x="753" y="797" font-size="11.5" fill="#5a5a5a" font-family="'Helvetica Neue', Helvetica, sans-serif">Fast</text><circle cx="915" cy="772" r="5.5" fill="#2a8f63"/><text x="928" y="777" font-size="13.5" fill="#1a1a1a" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif">High</text><text x="1092" y="773" font-size="12" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">Structured data: finance, fraud,</text><text x="1092" y="789" font-size="12" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">risk, churn</text><rect x="60" y="815" width="1280" height="70" fill="#f5f3ee" stroke="#d4d4cf" stroke-width="1"/><text x="72" y="855" font-size="13" fill="#2c3e5d" font-weight="700" font-family="'Georgia', 'Cambria', serif">Tabular</text><text x="222" y="855" font-size="14.5" fill="#1a1a1a" font-weight="700" font-family="'Georgia', 'Cambria', serif">Random Forest</text><circle cx="399" cy="842" r="5.5" fill="#2a8f63"/><text x="412" y="847" font-size="13.5" fill="#1a1a1a" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif">Varies</text><text x="395" y="867" font-size="11.5" fill="#5a5a5a" font-family="'Helvetica Neue', Helvetica, sans-serif">Light</text><circle cx="567" cy="842" r="5.5" fill="#c8860a"/><text x="580" y="847" font-size="13.5" fill="#1a1a1a" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif">Strong</text><text x="563" y="867" font-size="11.5" fill="#5a5a5a" font-family="'Helvetica Neue', Helvetica, sans-serif">Good</text><circle cx="757" cy="842" r="5.5" fill="#2a8f63"/><text x="770" y="847" font-size="13.5" fill="#1a1a1a" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif">Fast</text><text x="753" y="867" font-size="11.5" fill="#5a5a5a" font-family="'Helvetica Neue', Helvetica, sans-serif">Fast</text><circle cx="915" cy="842" r="5.5" fill="#2a8f63"/><text x="928" y="847" font-size="13.5" fill="#1a1a1a" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif">High</text><text x="1092" y="843" font-size="12" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">Interpretable tabular baselines</text><text x="1092" y="859" font-size="12" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">&amp; feature insight</text><circle cx="68" cy="903" r="5.5" fill="#2a8f63"/><text x="80" y="907" font-size="11.5" fill="#5a5a5a" font-family="'Helvetica Neue', Helvetica, sans-serif">Favorable</text><circle cx="180" cy="903" r="5.5" fill="#c8860a"/><text x="192" y="907" font-size="11.5" fill="#5a5a5a" font-family="'Helvetica Neue', Helvetica, sans-serif">Moderate</text><circle cx="295" cy="903" r="5.5" fill="#b5483d"/><text x="307" y="907" font-size="11.5" fill="#5a5a5a" font-family="'Helvetica Neue', Helvetica, sans-serif">Costly / limited</text><text x="1340" y="907" font-size="11" fill="#5a5a5a" font-style="italic" text-anchor="end" font-family="'Helvetica Neue', Helvetica, sans-serif">* GPT-4 parameter count is undisclosed; widely estimated to exceed one trillion.</text><g transform="translate(60,927)"><rect x="0" y="0" width="1280" height="46" fill="#7a1f2b"/><text x="20" y="30" font-size="22" fill="#fafaf6" font-weight="600" font-family="'Georgia', 'Cambria', serif" letter-spacing="2">III.  DOMAIN RECOMMENDATIONS</text><text x="1260" y="30" font-size="13" fill="#e8cdd2" font-style="italic" text-anchor="end" font-family="'Georgia', 'Cambria', serif">Match the model to the job</text></g><rect x="60" y="993" width="410" height="188" fill="#ffffff" stroke="#d4d4cf" stroke-width="1"/><rect x="60" y="993" width="410" height="6" fill="#7a1f2b"/><text x="78" y="1031" font-size="13.5" fill="#7a1f2b" font-weight="700" font-family="'Helvetica Neue', Helvetica, sans-serif" letter-spacing="1">NLP / GENERATIVE AI</text><text x="78" y="1059" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">Use GPT-class models when open-ended</text><text x="78" y="1078" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">generation and reasoning justify the cost and</text><text x="78" y="1097" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">latency. Prefer a compact encoder like BERT</text><text x="78" y="1116" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">for classification, search, and NER, where it</text><text x="78" y="1135" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">is far cheaper and faster.</text><rect x="494" y="993" width="410" height="188" fill="#ffffff" stroke="#d4d4cf" stroke-width="1"/><rect x="494" y="993" width="410" height="6" fill="#2c3e5d"/><text x="512" y="1031" font-size="13.5" fill="#2c3e5d" font-weight="700" font-family="'Helvetica Neue', Helvetica, sans-serif" letter-spacing="1">COMPUTER VISION</text><text x="512" y="1059" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">Choose EfficientNet when accuracy is paramount</text><text x="512" y="1078" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">and a server is available. Choose MobileNet</text><text x="512" y="1097" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">for phones, edge devices, and real-time</text><text x="512" y="1116" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">inference, accepting a few points of accuracy</text><text x="512" y="1135" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">for large speed and size gains.</text><rect x="928" y="993" width="410" height="188" fill="#ffffff" stroke="#d4d4cf" stroke-width="1"/><rect x="928" y="993" width="410" height="6" fill="#7a1f2b"/><text x="946" y="1031" font-size="13.5" fill="#7a1f2b" font-weight="700" font-family="'Helvetica Neue', Helvetica, sans-serif" letter-spacing="1">TABULAR DATA</text><text x="946" y="1059" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">Reach for gradient-boosted trees (XGBoost) or</text><text x="946" y="1078" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">Random Forests first. They usually match or</text><text x="946" y="1097" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">beat deep models on structured data while</text><text x="946" y="1116" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">training fast and offering the highest</text><text x="946" y="1135" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">interpretability via feature importance and</text><text x="946" y="1154" font-size="12.5" fill="#3a3a3a" font-family="'Helvetica Neue', Helvetica, sans-serif">SHAP.</text><rect x="60" y="1207" width="1280" height="84" fill="#2c3e5d"/><text x="86" y="1239" font-size="14" fill="#cfd4dc" font-weight="600" font-family="'Helvetica Neue', Helvetica, sans-serif" letter-spacing="2">KEY TAKEAWAY</text><text x="86" y="1263" font-size="15" fill="#fafaf6" font-family="'Georgia', 'Cambria', serif">Bigger is not always better. The strongest model on a leaderboard can be the wrong choice once size, speed, cost, and</text><text x="86" y="1285" font-size="15" fill="#fafaf6" font-family="'Georgia', 'Cambria', serif">interpretability are weighed. Define the deployment constraints first, then pick the smallest model that clears the bar.</text><text x="60" y="1315" font-size="11.5" fill="#5a5a5a" font-style="italic" font-family="'Helvetica Neue', Helvetica, sans-serif">Sources: Tan &amp; Le (2019); Sandler et al. (2018); Devlin et al. (2019); Chen &amp; Guestrin (2016); OpenAI (2023).</text><text x="1340" y="1315" font-size="11.5" fill="#5a5a5a" text-anchor="end" font-family="'Helvetica Neue', Helvetica, sans-serif">Artifact by Rishitha Reddy  ·  AIML-501: Model Development</text></svg>